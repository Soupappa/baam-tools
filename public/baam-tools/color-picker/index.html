<body class="baam-tool tool-frame-page" style="--tool-accent:#753CFF">
  <header class="tool-shell-header">
    <a class="tool-wordmark" href="/" aria-label="BAAM Tools, accueil"><baam-signe sans-polices univers="tools"></baam-signe></a>
    <a class="tool-back" href="/">← Bibliothèque</a>
  </header>
  <main class="tool-frame-main">
    <section class="tool-frame-info">
      <div><span>BAAM Tool</span><h1>Color Picker</h1></div>
      <p>Configurer ses couleurs, comprendre les palettes binaires, ternaires ou complémentaires, et les visualiser en temps réel sur le cercle chromatique.</p>
    </section>
    <div class="tool-frame-shell"><iframe id="tool-frame" title="Color Picker" allow="clipboard-write; fullscreen"></iframe></div>
  </main>
  <script>
    const frame = document.querySelector("#tool-frame");
    const outerPath = location.pathname;
    const loadInnerState = () => { frame.src = "./_tool/" + location.hash; };
    loadInnerState();
    window.addEventListener("hashchange", loadInnerState);
    setInterval(() => {
      try {
        const innerHash = frame.contentWindow.location.hash;
        if (innerHash !== location.hash) history.replaceState(null, "", outerPath + innerHash);
      } catch (_) {}
    }, 250);
  </script>
</body>
