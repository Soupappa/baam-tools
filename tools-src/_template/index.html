<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · BAAM.TOOLS</title>
  <meta name="description" content="{{SUMMARY}}">
  <meta property="og:title" content="{{TITLE}} · BAAM.TOOLS"><meta property="og:description" content="{{SUMMARY}}"><meta property="og:image" content="https://baam.pro/icones/og-tools.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://baam.pro/icones/og-tools.png">
  <link rel="icon" href="https://baam.pro/icones/b-tools.svg" type="image/svg+xml"><link rel="icon" href="https://baam.pro/icones/b-tools-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="https://baam.pro/icones/b-tools-180.png">
  <link rel="stylesheet" href="https://baam.pro/baam-tokens.css">
  <link rel="stylesheet" href="/tool-shell.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://baam.pro/baam-signe.js" defer></script>
</head>
<body class="baam-tool">
  <header class="tool-shell-header">
    <a class="tool-wordmark" href="/" aria-label="BAAM Tools, accueil"><baam-signe sans-polices univers="tools"></baam-signe></a>
    <a class="tool-back" href="/">← Bibliothèque</a>
  </header>

  <main class="tool-main">
    <section class="tool-heading">
      <div><span class="tool-kicker">BAAM Tool · {{ID}}</span><h1>{{TITLE}}</h1></div>
      <p>{{SUMMARY}}</p>
    </section>

    <section class="tool-workspace">
      <div class="tool-stage" aria-live="polite">
        <div class="demo-output" id="output">BAAM</div>
      </div>
      <div class="tool-controls">
        <div class="tool-field">
          <label for="matter">Matière</label>
          <input id="matter" value="BAAM" maxlength="48">
        </div>
        <div class="tool-field">
          <label for="intensity">Intensité</label>
          <input id="intensity" type="range" min="0" max="100" value="52">
        </div>
        <button class="tool-button" id="action" type="button">Activer</button>
      </div>
    </section>
    <p class="tool-note">Point de départ : conserve le shell, puis remplace librement la scène, les contrôles et la logique.</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
